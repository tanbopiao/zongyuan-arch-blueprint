name: Public safety gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  public-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate examples
        run: python3 tools/validate_examples.py

      - name: Public safety scan
        run: python3 tools/check_public_safety.py
